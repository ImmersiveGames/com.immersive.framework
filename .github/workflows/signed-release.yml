name: Sign and release UPM package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Sign, release and publish
    runs-on: ubuntu-latest
    env:
      UPM_SERVICE_ACCOUNT_KEY_ID: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_ID }}
      UPM_SERVICE_ACCOUNT_KEY_SECRET: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_SECRET }}
      UPM_ORG_ID: ${{ secrets.UPM_ORG_ID }}
      DIST_DIR: /tmp/signed-upm-dist

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Read and verify package metadata
        id: package
        shell: bash
        run: |
          package_name="$(jq -r '.name' package.json)"
          package_version="$(jq -r '.version' package.json)"
          tag_version="${GITHUB_REF_NAME#v}"

          test -n "$package_name"
          test -n "$package_version"
          if [ "$tag_version" != "$package_version" ]; then
            printf 'Tag version %s does not match package version %s\n' "$tag_version" "$package_version" >&2
            exit 1
          fi

          echo "PACKAGE_NAME=$package_name" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"
          echo "name=$package_name" >> "$GITHUB_OUTPUT"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          printf 'Package: %s@%s\n' "$package_name" "$package_version"

      - name: Install Unity UPM CLI
        shell: bash
        run: |
          curl -fsSL https://cdn.packages.unity.com/upm-cli/install.sh -o /tmp/upm-cli-install.sh
          bash /tmp/upm-cli-install.sh
          echo "$HOME/.upm/bin" >> "$GITHUB_PATH"

      - name: Verify Unity UPM CLI
        run: upm --help

      - name: Sign package
        shell: bash
        run: |
          mkdir -p "$DIST_DIR"
          upm pack . --organization-id "$UPM_ORG_ID" --destination "$DIST_DIR"

      - name: Verify signed archive
        id: archive
        shell: bash
        run: |
          shopt -s nullglob
          archives=("$DIST_DIR"/*.tgz "$DIST_DIR"/*.tar.gz)
          if [ "${#archives[@]}" -ne 1 ]; then
            printf 'Expected one signed archive, found %s\n' "${#archives[@]}" >&2
            exit 1
          fi

          archive="${archives[0]}"
          archive_index="$DIST_DIR/archive-index.txt"
          tar -tzf "$archive" > "$archive_index"

          required_entries=(
            package/package.json
            package/README.md
            package/CHANGELOG.md
            package/CHANGELOG.md.meta
            package/LICENSE.md
            package/LICENSE.md.meta
            package/README.md.meta
            package/package.json.meta
            package/Runtime/Immersive.Framework.Runtime.asmdef
            package/Runtime/Immersive.Framework.Runtime.asmdef.meta
            package/Editor/Immersive.Framework.Editor.asmdef
            package/Editor/Immersive.Framework.Editor.asmdef.meta
            package/Tests/Editor/PlayerParticipation/Immersive.Framework.PlayerParticipation.Editor.Tests.asmdef
            package/Tests/Editor/PlayerParticipation/Immersive.Framework.PlayerParticipation.Editor.Tests.asmdef.meta
            package/Documentation~/API/Public-API.md
            package/Documentation~/README.md
          )
          for entry in "${required_entries[@]}"; do
            if ! grep -Fx "$entry" "$archive_index" >/dev/null; then
              printf 'Required package entry is missing: %s\n' "$entry" >&2
              exit 1
            fi
          done

          forbidden_entries='(^|/)(\.agents|\.github|\.idea|Claude outputs|docs|Temp|Bin|bin|obj|Library)(/|$)|(^|/)(Claude outputs|docs|Temp)\.meta$|(^|/)(\.codex-camera026g-runtime\.csproj|\.gitignore|Folder\.DotSettings\.user(\.meta)?|[^/]+\.(csproj|sln|user|userprefs|log|tmp|bak|patch|patch\.meta|diff))$'
          if grep -E "$forbidden_entries" "$archive_index" >/dev/null; then
            printf 'Archive contains development or local files:\n' >&2
            grep -E "$forbidden_entries" "$archive_index" >&2
            exit 1
          fi

          grep -Fx 'package/.attestation.p7m' "$archive_index" >/dev/null

          archive_name="$(tar -xOzf "$archive" package/package.json | jq -r '.name')"
          archive_version="$(tar -xOzf "$archive" package/package.json | jq -r '.version')"
          test "$archive_name" = "$PACKAGE_NAME"
          test "$archive_version" = "$PACKAGE_VERSION"
          echo "path=$archive" >> "$GITHUB_OUTPUT"
          printf 'Signed archive: %s\n' "$(basename "$archive")"

      - name: Create GitHub Release and upload signed archive
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.package.outputs.name }} ${{ steps.package.outputs.version }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.archive.outputs.path }}

      - name: Publish signed archive through OpenUPM
        uses: openupm/openupm-action@v1
        with:
          package: ${{ steps.package.outputs.name }}
          tag: ${{ github.ref_name }}
          timeout-minutes: 30
